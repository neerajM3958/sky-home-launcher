# Sky Home Launcher settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=false

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# The look the home screen starts with: material3-expressive or glass (liquid glass).
# *Home Settings* on the TV changes it, and what you pick there wins.
look=material3-expressive

# Light or dark: auto (dark from sunset to sunrise, where you live), dark, or light. Also changeable on the TV.
theme=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# false keeps the TV's own screensaver (Sky Home Launcher then changes only the home screen and the promo apps)
screensaver=true

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (on Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay, now,
# kinopoisk, premier, amediateka, wink.
# For apps the TV ships that you don't subscribe to (Prime Video on a Sony, say). These are the first values:
# Sky Home Launcher > TMDB > Hidden services changes them on the TV.
hide_services=
# true: picks and catalogs only from titles included in a subscription service in your region. false: any popular title (one that
# streams nowhere there says it is unavailable in your region, or opens in Stremio: Sky Home Launcher > Stremio).
flatrate_only=true
# Only titles whose original language is one of these (two-letter codes, comma separated: en,hi,ko). Empty = any.
# Picks and catalogs follow it; Sky Home Launcher > TMDB > Languages changes it on the TV.
tmdb_languages=
# true: also the titles you can only rent or buy (Apple TV, Prime Video, Google Play, YouTube...). Needs flatrate_only=true.
include_rent_buy=false
# true: Continue Watching (under the drawer's cards) also lists what the TV's other apps say you were watching (Android's
# Watch Next, read on the TV only), next to your Trakt list if you connected one. The TV asks once to allow reading it.
watch_next=true
# Poster rows under the drawer's weather and quotes cards (Down from the drawer's buttons), one TMDB request each: trending,
# popular_movies, popular_shows, top_rated, now_playing, upcoming, hindi. "none" = no rows. A title opens in the app of
# the service that streams it in your region (tmdb_region), in that app's Play Store page when the app isn't on the TV,
# or in Stremio where Sky Home Launcher > Stremio says so. On a TV short of memory (a 720p UI, a low-RAM flag or under 1.5 GB), with
# this line as it ships the rows start off (Sky Home Launcher > TMDB > Catalogs turns them on); a list you write here is used as written.
catalogs=trending,popular_movies,popular_shows,hindi,top_rated
# How many picks the home screen rotates through (3 to 12; 3 shows this hour's three, more slides through them in
# a circle with the remote's left and right) and, if above 0, every how many seconds they move by themselves while
# focus is elsewhere.
pick_count=3
pick_rotate_seconds=0

# Optional: a free Watchmode key (watchmode.com) makes a title (a pick, a catalog or Trakt card) open its own page in its app
# (Prime Video, JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=

# Optional: your Trakt Client ID (free: app.trakt.tv/settings/apps/api/new; the form asks for a redirect URI, which
# Sky Home Launcher never uses: put urn:ietf:wg:oauth:2.0:oob). It adds Continue Watching and Watchlist rows under the home
# screen's cards. Then on the TV: Sky Home Launcher > Trakt, and enter the code it shows at trakt.tv/activate. There is no
# secret to keep, and Sky Home Launcher only reads your Trakt lists. The rows open like the ones above.
trakt_client_id=

# Debug only: true shows a small memory card (top right, over every app) with the free and total RAM and whichever
# app is in front's memory use, refreshed every 2 seconds. The free/total numbers always work; the app's own number
# needs ADB (same "Allow USB debugging" this app already asks for), so it reads "—" until that's been granted once.
show_memory_card=false
